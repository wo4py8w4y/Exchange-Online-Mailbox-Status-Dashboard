<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Online Dashboard</title>
    
    <script src="https://code.highcharts.com/highcharts.js"></script>

    <style>
        /* CSS Variables for Theming */
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --border-color: #dddddd;
            --header-bg: #0078d4; /* Microsoft Blue */
            --header-text: #ffffff;
            --row-hover: #f1f8ff;
            --btn-bg: #333333;
            --btn-text: #ffffff;
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #aaaaaa;
            --border-color: #333333;
            --header-bg: #005a9e;
            --header-text: #ffffff;
            --row-hover: #2a2d35;
            --btn-bg: #e0e0e0;
            --btn-text: #121212;
        }

        /* Base Styles */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
            margin: 0;
            padding: 20px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .theme-toggle {
            padding: 8px 16px;
            background-color: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .dashboard-container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.3s, border-color 0.3s;
        }

        /* Table Styles */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--header-bg);
            color: var(--header-text);
            position: sticky;
            top: 0;
        }

        tr:hover {
            background-color: var(--row-hover);
            cursor: pointer;
        }

        .size-warning { color: #d83b01; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-controls">
        <h2>Mailbox Capacity Dashboard</h2>
        <button id="themeToggle" class="theme-toggle">Switch to Dark Mode</button>
    </div>

    <div class="dashboard-container">
        <h3>Current Status (Hot Data)</h3>
        <table id="mailboxTable">
            <thead>
                <tr>
                    <th>Display Name</th>
                    <th>Primary SMTP</th>
                    <th>Size (GB)</th>
                    <th>Item Count</th>
                    <th>Last Logon</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5">Loading data...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // --- 1. Theme Toggle Logic ---
        const themeToggle = document.getElementById('themeToggle');
        
        // Check local storage for user preference
        const savedTheme = localStorage.getItem('dashboardTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateButtonText(savedTheme);

        themeToggle.addEventListener('click', () => {
            let currentTheme = document.documentElement.getAttribute('data-theme');
            let newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('dashboardTheme', newTheme);
            updateButtonText(newTheme);
        });

        function updateButtonText(theme) {
            themeToggle.textContent = theme === 'light' ? 'Switch to Dark Mode' : 'Switch to Light Mode';
        }

        // --- 2. Data Fetching Logic ---
        async function loadHotData() {
            try {
                // Fetch the data.json file generated by Extract-HotData.ps1
                // Add a cache-busting query string so the browser doesn't hold stale data
                const response = await fetch('data.json?t=' + new Date().getTime());
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                renderTable(data);
            } catch (error) {
                console.error("Error loading hot data:", error);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="5" style="color:red;">Error loading data. Ensure data.json exists and the web server is running.</td></tr>`;
            }
        }

        function renderTable(mailboxes) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = ''; // Clear loading message

            // Sort by Size Descending
            mailboxes.sort((a, b) => b.MailboxSizeGB - a.MailboxSizeGB);

            mailboxes.forEach(mbx => {
                const tr = document.createElement('tr');
                
                // Add an event listener so clicking a row can trigger historical charts later
                tr.onclick = () => { console.log("Clicked:", mbx.ExchangeGuid); };

                // Highlight large mailboxes (Example threshold: 45GB)
                const sizeClass = mbx.MailboxSizeGB > 45 ? 'size-warning' : '';

                tr.innerHTML = `
                    <td>${mbx.DisplayName || 'N/A'}</td>
                    <td>${mbx.PrimarySmtpAddress || 'N/A'}</td>
                    <td class="${sizeClass}">${mbx.MailboxSizeGB.toFixed(2)}</td>
                    <td>${mbx.ItemCount.toLocaleString()}</td>
                    <td>${mbx.LastLogonTime ? new Date(mbx.LastLogonTime).toLocaleDateString() : 'Never'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Load data when page initializes
        loadHotData();
    </script>
</body>
</html>
