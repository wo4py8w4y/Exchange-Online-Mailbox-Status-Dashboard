<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Exchange Online Mailbox Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <script>
        const savedTheme = localStorage.getItem('dashboardTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body data-page="overview">
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1>Exchange Online Mailbox Dashboard</h1>
            <p id="lastUpdated">Loading...</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button id="themeToggle" class="btn-secondary">Switch to Dark Mode</button>
            <button id="refreshButton" class="btn-primary">Refresh now</button>
        </div>
    </header>

    <nav class="panel view-nav" aria-label="Views">
        <strong>Views:</strong>
        <a href="index.html">Dashboard</a> |
        <a href="history.html">History</a> |
        <a href="permissions.html">Permissions</a> |
        <a href="thresholds.html">Thresholds</a>
    </nav>

    <main>
        <section class="panel search-container">
            <label for="mailboxSearch"><strong>Find Mailbox:</strong></label>
            <input list="mailboxList" id="mailboxSearch" placeholder="Type a Name or SMTP address to filter...">
            <datalist id="mailboxList"></datalist>
            <button id="clearSearchBtn" class="btn-secondary">Clear Filter</button>
        </section>

        <section class="cards">
            <article><span class="label">Mailboxes</span><strong id="mailboxCount">0</strong></article>
            <article><span class="label">Total storage</span><strong id="totalStorage">0 GB</strong></article>
            <article><span class="label">Threshold alerts</span><strong id="thresholdCount">0</strong></article>
            <article><span class="label">Largest mailbox</span><strong id="largestMailbox">N/A</strong></article>
        </section>

        <section class="chart-grid">
            <article class="panel">
                <h2>Mailbox health</h2>
                <canvas id="usageDonutChart" width="520" height="360"></canvas>
            </article>
            <article class="panel">
                <h2>Top storage consumers</h2>
                <canvas id="topStorageChart" width="760" height="420"></canvas>
            </article>
        </section>

        <section class="panel">
            <h2 id="tableTitle">Current usage</h2>
            <div class="table-wrap">
                <table id="usageTable">
                    <thead>
                        <tr>
                            <th>Mailbox</th>
                            <th>SMTP Address</th>
                            <th>Storage GB</th>
                            <th>Items</th>
                            <th>Quota GB</th>
                            <th>Usage %</th>
                            <th>Permissions</th>
                            <th>Last logon</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
    <script defer src="dashboard.js"></script>
</body>
</html>
