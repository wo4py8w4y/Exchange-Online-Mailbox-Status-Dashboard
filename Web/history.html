<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Mailbox History</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
</head>

<body data-page="history">
    <header>
        <div>
            <h1>Mailbox Historical Usage</h1>
            <p id="lastUpdated">Loading...</p>
        </div>
        <button id="refreshButton">Refresh now</button>
    </header>

    <nav class="panel view-nav" aria-label="Views">
        <strong>Views:</strong>
        <a href="index.html">Dashboard</a> |
        <a href="history.html">History</a> |
        <a href="permissions.html">Permissions</a> |
        <a href="thresholds.html">Thresholds</a>
    </nav>

    <main>
        <section class="panel">
            <h2>Historical storage and utilisation</h2>
            <label for="mailboxSelect">Mailbox</label>
            <select id="mailboxSelect"></select>

            <div class="chart-grid">
                <div>
                    <h3>Storage GB</h3>
                    <canvas id="historyStorageChart" width="1000" height="320"></canvas>
                </div>
                <div>
                    <h3>Utilisation %</h3>
                    <canvas id="historyUtilisationChart" width="1000" height="320"></canvas>
                </div>
            </div>
        </section>
    </main>

    <script defer src="dashboard.js"></script>
</body>

</html>
