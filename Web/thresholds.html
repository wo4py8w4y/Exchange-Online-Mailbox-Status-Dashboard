<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Mailbox Thresholds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <script>
        const savedTheme = localStorage.getItem('dashboardTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body data-page="thresholds">
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h1>Mailbox Thresholds</h1>
            <p id="lastUpdated">Loading...</p>
        </div>
        <div style="display: flex; gap: 10px;">
            <button id="themeToggle" class="btn-secondary">Switch to Dark Mode</button>
            <button id="refreshButton" class="btn-primary">Refresh now</button>
        </div>
    </header>

    <nav class="panel view-nav" aria-label="Views">
        <strong>Views:</strong>
        <a href="index.html">Dashboard</a> |
        <a href="history.html">History</a> |
        <a href="permissions.html">Permissions</a> |
        <a href="thresholds.html">Thresholds</a>
    </nav>

    <main>
        <section class="panel search-container">
            <label for="mailboxSearch"><strong>Find Mailbox:</strong></label>
            <input list="mailboxList" id="mailboxSearch" placeholder="Filter alerts by Name or SMTP address...">
            <datalist id="mailboxList"></datalist>
            <button id="clearSearchBtn" class="btn-secondary">Clear Filter</button>
        </section>

        <section class="panel critical-panel">
            <h2>Mailboxes at or above 85% utilisation</h2>
            <div class="table-wrap">
                <table id="thresholdTable">
                    <thead>
                        <tr>
                            <th>Mailbox</th>
                            <th>Storage GB</th>
                            <th>Quota GB</th>
                            <th>Usage %</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
    <script defer src="dashboard.js"></script>
</body>
</html>
