<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Mailbox Thresholds</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
    <script>
        const savedTheme = localStorage.getItem('dashboardTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body data-page="thresholds">
    <header class="app-header">
        <div>
            <h1>Mailbox Thresholds</h1>
            <p id="lastUpdated">Loading...</p>
        </div>
        <div class="header-actions">
            <button id="themeToggle" class="btn-secondary">Switch to Dark Mode</button>
            <button id="refreshButton" class="btn-primary">Refresh now</button>
        </div>
    </header>

    <nav class="panel view-nav" aria-label="Views">
        <strong>Views:</strong>
        <a href="index.html">Dashboard</a> |
        <a href="mailbox.html">Mailbox</a> |
        <a href="history.html">History</a> |
        <a href="permissions.html">Permissions</a> |
        <a href="thresholds.html">Thresholds</a>
    </nav>

    <main>
        <section class="panel search-panel">
            <div class="search-panel-head">
                <div>
                    <h2>Threshold monitor</h2>
                    <p id="searchStatus" class="panel-subtitle">View all alerts or select one mailbox for a focused view.</p>
                </div>
                <button id="clearSearchBtn" class="btn-secondary">Clear</button>
            </div>
            <div class="search-shell">
                <label class="sr-only" for="mailboxSearch">Find Mailbox</label>
                <input id="mailboxSearch" autocomplete="off" placeholder="Search warning and critical mailboxes">
                <button id="openMailboxBtn" class="btn-primary" type="button">Open mailbox view</button>
            </div>
            <div id="selectedMailboxSummary" class="selected-mailbox-summary" hidden></div>
            <section id="searchResultsPanel" class="search-results-panel" hidden>
                <div class="search-results-head">
                    <strong id="searchResultsTitle">Matches</strong>
                    <span id="searchResultsMeta"></span>
                </div>
                <div id="searchResults" class="search-results"></div>
            </section>
        </section>

        <section id="selectedMailboxPanel" class="panel selected-mailbox-panel" hidden></section>

        <section class="panel critical-panel">
            <div class="table-header">
                <h2>Mailboxes at or above 85% utilisation</h2>
                <p id="tableMeta" class="panel-subtitle"></p>
            </div>
            <div class="table-wrap">
                <table id="thresholdTable">
                    <thead>
                        <tr>
                            <th>Mailbox</th>
                            <th>Storage GB</th>
                            <th>Quota GB</th>
                            <th>Usage %</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </main>
    <script defer src="dashboard.js"></script>
</body>
</html>
